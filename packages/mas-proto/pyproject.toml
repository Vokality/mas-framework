[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "mas-proto"
version = "0.5.0"
description = "MAS runtime protobuf definitions"
requires-python = ">=3.13"
dependencies = [
    "grpcio>=1.84.0",
    "protobuf>=7.36.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mas_proto"]
