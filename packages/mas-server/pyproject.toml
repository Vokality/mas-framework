[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "mas-server"
version = "0.5.0"
description = "MAS server runtime"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "cryptography>=50.0.2",
    "PyJWT[crypto]>=2.15.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-proto>=1.44.0",
    "protobuf>=7.36.2",
    "pydantic>=2.13.5",
    "redis[hiredis]>=8.1.0",
    "grpcio>=1.84.0",
    "mas-core",
    "mas-gateway",
    "mas-proto",
]

[tool.uv.sources]
mas-core = { workspace = true }
mas-gateway = { workspace = true }
mas-proto = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mas_server"]
artifacts = ["src/mas_server/dashboard_assets/**"]
exclude = ["src/mas_server/dashboard.html"]
