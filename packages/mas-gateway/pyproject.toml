[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "mas-gateway"
version = "0.5.0"
description = "MAS security and gateway policy modules"
requires-python = ">=3.13"
dependencies = [
    "redis[hiredis]>=8.1.0",
    "mas-core",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[tool.uv.sources]
mas-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mas_gateway"]
