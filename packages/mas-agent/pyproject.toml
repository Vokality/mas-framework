[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "mas-agent"
version = "0.5.0"
description = "MAS agent client runtime"
requires-python = ">=3.13"
dependencies = [
    "opentelemetry-api>=1.44.0",
    "grpcio>=1.84.0",
    "mas-core",
    "mas-proto",
    "pydantic>=2.13.5",
]

[tool.uv.sources]
mas-core = { workspace = true }
mas-proto = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mas_agent"]
