name: Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    permissions:
      contents: read

    services:
      redis:
        image: redis:8.10.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen --all-groups --all-packages

      - name: Verify dashboard
        uses: ./.github/actions/dashboard

      - name: Install verified Redis executable for isolated recovery tests
        run: |
          curl --fail --silent --show-error --location https://download.redis.io/releases/redis-8.10.2.tar.gz --output /tmp/redis.tar.gz
          echo 'b9ffee226b5eecdba98a679260dad764b2a4ebd90dce4ad5ac9e9f3eef9c02b3  /tmp/redis.tar.gz' | sha256sum --check
          tar -xzf /tmp/redis.tar.gz -C /tmp
          make -C /tmp/redis-8.10.2 -j2 BUILD_TLS=yes MALLOC=libc redis-server
          sudo install /tmp/redis-8.10.2/src/redis-server /usr/local/bin/redis-server

      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379/0
        run: uv run pytest -q
