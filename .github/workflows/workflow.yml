name: Validation

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint-and-types:
    name: lint-and-types
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen --all-groups --all-packages

      - name: Verify dashboard
        uses: ./.github/actions/dashboard

      - name: Check browser fixtures
        run: uv run --frozen python -m dashboard.tests.generate_browser_fixtures --check

      - name: Install Chromium for dashboard checks
        working-directory: dashboard
        run: npx playwright install --with-deps chromium

      - name: Test dashboard browser behavior
        run: npm run test:browser --prefix dashboard

      - name: Preserve dashboard browser failures
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dashboard-browser-failures
          path: dashboard/test-results/
          if-no-files-found: ignore

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run ty check
